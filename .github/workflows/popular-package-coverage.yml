name: Popular package coverage

on:
  workflow_dispatch:
  push:
    branches: [main, codex/popular-package-coverage]
    paths:
      - scripts/popularity-plan.py
      - scripts/test-popularity-plan.py
      - scripts/verify-popular-packages.py
      - src/api/client.zig
      - registry/upstream.json
      - src/upstream/registry_default.json
      - .github/workflows/popular-package-coverage.yml
  pull_request:
    paths:
      - scripts/popularity-plan.py
      - scripts/test-popularity-plan.py
      - scripts/verify-popular-packages.py
      - src/api/client.zig
      - registry/upstream.json
      - src/upstream/registry_default.json
      - .github/workflows/popular-package-coverage.yml

permissions:
  contents: read

concurrency:
  group: popular-package-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test-popularity-plan.py
      - name: Rank demand and assess packaging metadata
        run: |
          python3 scripts/popularity-plan.py --top 100
          cat dist/popularity/plan.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: popularity-plan
          path: dist/popularity/

  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26]
        resolution: [pinned, default]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NANOBREW_NO_TELEMETRY: '1'
      NB_TEST_RESOLUTION: ${{ matrix.resolution }}
      NANOBREW_DISABLE_UPSTREAM_REGISTRY_REMOTE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Nanobrew with the proposed registry
        run: zig build -Doptimize=ReleaseFast
      - name: Install popular tools on disposable runner
        run: |
          sudo ./zig-out/bin/nb init
          sudo chown -R "$(id -un)" /opt/nanobrew
          if [ "$NB_TEST_RESOLUTION" = pinned ]; then
            export NANOBREW_DISABLE_UPSTREAM_FRESHNESS=1
          fi
          NANOBREW_UPSTREAM_REGISTRY_CACHE="$PWD/registry/upstream.json" ./zig-out/bin/nb install gh uv oras ripgrep just fd git-lfs codedb codegraff
      - name: Check exact pins, native architecture and tool behavior
        run: python3 scripts/verify-popular-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: popular-packages-${{ matrix.runner }}-${{ matrix.resolution }}
          path: dist/popular-packages-*.json
