name: Release artifact check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        default: v0.1.216
  pull_request:
    paths:
      - .github/workflows/release-artifact-check.yml
      - scripts/verify-popular-packages.py

permissions:
  contents: read

jobs:
  signed-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.1.216' }}
      NANOBREW_UPSTREAM_REGISTRY_CACHE: ${{ github.workspace }}/registry/upstream.json
      GH_TOKEN: ${{ github.token }}
      NANOBREW_NO_TELEMETRY: '1'
      NANOBREW_DISABLE_UPSTREAM_REGISTRY_REMOTE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify signed release artifact
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ ! $RELEASE_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "error: expected a release tag vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          # Release candidates report the base version, without the -rc.N suffix.
          version="${BASH_REMATCH[1]}"
          mkdir -p dist/release-check
          cd dist/release-check
          archive="nb-$ARCH-apple-darwin.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
          tar -xzf "$archive"
          codesign --verify --strict nb
          codesign -dv --verbose=4 nb 2> signature.txt
          grep -q 'Authority=Developer ID Application' signature.txt
          grep -q 'flags=0x10000(runtime)' signature.txt
          lipo nb -verify_arch "$ARCH"
          ./nb version > version.txt
          cat version.txt
          if ! cmp -s version.txt <(printf '%s\n' "$version"); then
            echo "error: expected nb version to report exactly $version for $RELEASE_TAG" >&2
            exit 1
          fi
      # The artifact predates source selection fixes in this checkout. Use
      # checksum-pinned inputs here; popular-package-coverage tests live
      # resolution with the newly built binary.
      - name: Install and exercise the checksum-pinned package selection
        env:
          NANOBREW_DISABLE_UPSTREAM_FRESHNESS: '1'
          NB_TEST_RESOLUTION: pinned
        run: |
          sudo ./dist/release-check/nb init
          sudo chown -R "$(id -un)" /opt/nanobrew
          ./dist/release-check/nb install gh uv oras ripgrep just fd git-lfs codedb codegraff
          python3 scripts/verify-popular-packages.py ./dist/release-check/nb
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.arch }}
          path: |
            dist/release-check/signature.txt
            dist/release-check/version.txt
            dist/release-check/*.sha256
            dist/popular-packages-*.json
