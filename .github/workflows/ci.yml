name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (Debug)
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test
        run: ./zig-out/bin/nb help

      - name: Test init creates opt/ directory
        run: |
          sudo ./zig-out/bin/nb init
          test -d /opt/nanobrew/prefix/opt || (echo "FAIL: opt/ directory not created by nb init" && exit 1)
          echo "PASS: opt/ directory exists"

      - name: Unit tests
        run: zig build test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proxy, scheduler, bottle scan and site regression tests
        run: |
          zig build-exe -lc src/test_proxy_transport.zig -femit-bin=/tmp/nb-proxy-fixture
          python3 scripts/test_proxy_transport.py /tmp/nb-proxy-fixture
          zig build-exe -lc src/test_autoupdate_runner.zig -femit-bin=/tmp/nb-autoupdate-fixture
          python3 tests/autoupdate.py ./zig-out/bin/nb /tmp/nb-autoupdate-fixture
          python3 scripts/bottles/test_scan.py
          node worker/test.mjs
          node worker/test-outcomes.mjs
          if [ "$(uname -s)" = Darwin ]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          python3 scripts/trust/test_trust.py ./zig-out/bin/nb

      - name: Shell completion regression tests
        run: bash tests/completions.sh ./zig-out/bin/nb

      - name: Repository checks
        run: zig build repo-checks

      - name: Smoke integration tests
        run: bash tests/smoke-test.sh ./zig-out/bin/nb

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nb-macos-arm64
          path: zig-out/bin/nb

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for Linux x86_64
        run: zig build linux

      - name: Verify binary
        run: file zig-out/bin/nb && ls -lh zig-out/bin/nb

      - name: Smoke test
        run: ./zig-out/bin/nb help

      - name: Unit tests
        run: zig build test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proxy, scheduler, bottle scan and site regression tests
        run: |
          zig build-exe -lc src/test_proxy_transport.zig -femit-bin=/tmp/nb-proxy-fixture
          python3 scripts/test_proxy_transport.py /tmp/nb-proxy-fixture
          zig build-exe -lc src/test_autoupdate_runner.zig -femit-bin=/tmp/nb-autoupdate-fixture
          python3 tests/autoupdate.py ./zig-out/bin/nb /tmp/nb-autoupdate-fixture
          python3 scripts/bottles/test_scan.py
          node worker/test.mjs
          node worker/test-outcomes.mjs
          if [ "$(uname -s)" = Darwin ]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          python3 scripts/trust/test_trust.py ./zig-out/bin/nb

      - name: Test init creates opt/ directory
        run: |
          sudo ./zig-out/bin/nb init
          test -d /opt/nanobrew/prefix/opt || (echo "FAIL: opt/ directory not created by nb init" && exit 1)
          echo "PASS: opt/ directory exists"

      - name: Deb parity test (online, musl TLS flaky)
        continue-on-error: true
        run: bash tests/deb-parity.sh ./zig-out/bin/nb

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nb-linux-x86_64
          path: zig-out/bin/nb



  build-windows-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-build Windows binary
        run: zig build windows

      - name: Upload Windows binary for smoke
        uses: actions/upload-artifact@v4
        with:
          name: nb-windows-smoke
          path: zig-out/bin/nb.exe

  smoke-windows-native:
    runs-on: windows-latest
    needs: build-windows-native
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: nb-windows-smoke
          path: .

      - name: Smoke native Windows package manager
        shell: pwsh
        run: |
          $nb = Resolve-Path .\nb.exe
          & $nb help
          & $nb init
          & $nb search uv
          & $nb search yq
          & $nb search zoxide
          & $nb search bun
          & $nb search kubectl
          $ErrorActionPreference = 'Stop'
          # Keep this smoke intentionally small; larger runtime archives (bun/deno/yazi)
          # are covered by checksum/archive validation and can be slow on hosted runners.
          & $nb install watchexec pastel xsv
          & $env:LOCALAPPDATA\nanobrew\bin\watchexec.exe --version
          & $env:LOCALAPPDATA\nanobrew\bin\pastel.exe --version
          & $env:LOCALAPPDATA\nanobrew\bin\xsv.exe --version
          & $nb list
          & $nb doctor

      - name: Upload smoked Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: nb-windows-x86_64
          path: nb.exe

  cross-compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile x86_64-linux
        run: zig build linux

      - name: Cross-compile aarch64-linux
        run: zig build linux-arm
