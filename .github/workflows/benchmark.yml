name: Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pin Homebrew 7.0.2 and released Nanobrew
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew_repo=$(brew --repository)
          git -C "$brew_repo" fetch --depth=1 origin tag 7.0.2
          git -C "$brew_repo" checkout --detach 7.0.2
          brew --version
          mkdir -p "$RUNNER_TEMP/nb-release"
          cd "$RUNNER_TEMP/nb-release"
          arch=$(uname -m)
          archive="nb-${arch}-apple-darwin.tar.gz"
          gh release download v0.1.212 --repo justrach/nanobrew --pattern "$archive" --pattern "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
          tar -xzf "$archive"
          chmod +x nb
          ./nb --version
          echo "NB_BENCH_BINARY=$RUNNER_TEMP/nb-release/nb" >> "$GITHUB_ENV"
      - name: Run repeated cold and warm comparisons
        env:
          NANOBREW_NO_TELEMETRY: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: python3 scripts/bench-homebrew-current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.runner }}
          path: benchmark-results/
